
name: MLOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint Python code
        run: ruff check src tests

      - name: Run data acquisition and preprocessing
        run: |
          python src/download_data.py
          python src/preprocess_data.py

      - name: Run exploratory data analysis
        run: python src/eda.py

      - name: Train and evaluate models
        run: python src/train_model.py

      - name: Track MLflow experiments
        run: python src/track_experiments.py

      - name: Run automated tests
        run: python -m pytest tests -v

      - name: Build Docker image
        run: docker build -t heart-disease-api:ci .

      - name: Upload experiment and evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-artifacts
          if-no-files-found: warn
          path: |
            reports/
            models/best_model.joblib
